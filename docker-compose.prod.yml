# Public hosting on a VPS behind Caddy:  docker compose -f docker-compose.prod.yml up -d --build
# Caddy terminates TLS (automatic Let's Encrypt for the DuckDNS name in Caddyfile) and proxies
# to the app. The app port is bound to localhost only; Caddy reaches it over the compose network.
# The 8100 demo site stays container-internal: the "Scan the built-in demo site" button
# only appears when the app is opened via 127.0.0.1/localhost, so public visitors never see it.
services:
  vibeguard:
    build: .
    image: vibeguard:local
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - vibeguard-data:/data
    env_file:
      - path: .env
        required: false
    environment:
      # Strangers must not scan this server's own localhost (README hardening note).
      # TRUST_PROXY_HEADERS is safe now that only Caddy (below) proxies the app: clients can't
      # reach uvicorn directly to spoof X-Forwarded-For, and real visitor IPs reach the limiter.
      WEB_ALLOW_LOCAL: "false"
      TRUST_PROXY_HEADERS: "true"
      # This VPS has 2 GB RAM; the deep REA engine needs ~6 GB. Point REA_BIN at a nonexistent
      # path so rea_available() is false: the UI hides the Deep option and /health reports it
      # honestly, instead of users picking a scan that would be OOM-killed mid-run.
      REA_BIN: "/nonexistent"
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - vibeguard

volumes:
  vibeguard-data:
  caddy-data:
  caddy-config:
